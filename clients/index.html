<!DOCTYPE html>

        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .client-card {
            background: var(--card-bg, #f9f9f9);
            border: 1px solid var(--border-color, #eaeaea);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .client-card:hover {
            transform: translateY(-5px);
        }

        .client-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .client-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .client-service {
            font-weight: 500;
            color: #555;
            margin-bottom: 1rem;
        }
    </style>
</head>
