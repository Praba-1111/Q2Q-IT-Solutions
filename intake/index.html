<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner With Us | Q2Q IT Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=2.0">
    <link rel="stylesheet" href="/intake/style.css?v=2.0">
    <link rel="icon" type="image/png" href="/favicon.ico">
</head>

<body>
    <header>
        <a href="../index.html" class="logo">Q2Q <span
                style="color: var(--text-muted); font-weight: 400; font-size: 1.2rem;">IT SOLUTIONS</span></a>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../careers/index.html">Careers</a></li>
                <li><a href="../team/index.html">Team</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="intake-container">
            <div class="intake-header">
                <h2>Partner With Us</h2>
                <p>Fill out the form below to start your digital transformation journey with Q2Q IT Solutions.</p>
            </div>

            <div id="successMessage" class="success-message">
                <h3>Thank You!</h3>
                <p>Your inquiry has been submitted successfully. Our team will be in touch with you shortly.</p>
            </div>

            <form id="intakeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" name="company">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Work Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </div>


                <div class="form-group">
                    <label for="projectDetails">Project Details or Message *</label>
                    <textarea id="projectDetails" name="projectDetails" rows="5" required
                        placeholder="Tell us a little bit about your goals and requirements..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Inquiry</button>
            </form>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="/components/footer.js"></script>

    <script src="/intake/script.js?v=2.0"></script>
</body>

</html>
